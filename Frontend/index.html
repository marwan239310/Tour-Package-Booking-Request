<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tour Package Booking</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/auth.css">
    </head>
    <body>
        <header>
            <h1>Tour Package Booking</h1>
            <p>Explore available tour packages</p>
            <nav class="top-nav">
                <a href="index.html" class="active">Packages</a>
                <a href="booking.html">Book a tour</a>
                <a href="my-bookings.html">My requests</a>
                <a href="staff.html">Staff</a>
            </nav>
        </header>
        <main>
            <section id="packages-section">
                <h2>Available Packages</h2>

                <form id="search-form" class="search-form" novalidate>
                    <div>
                        <label for="search-destination">Destination</label>
                        <input type="text" id="search-destination" placeholder="e.g. Alex" maxlength="60">
                    </div>
                    <div>
                        <label for="search-start">Starting from</label>
                        <input type="date" id="search-start">
                    </div>
                    <div>
                        <label for="search-end">Ending by</label>
                        <input type="date" id="search-end">
                    </div>
                    <div>
                        <label for="search-max-price">Max price (EGP)</label>
                        <input type="number" id="search-max-price" min="0" step="1">
                    </div>
                    <div class="search-buttons">
                        <button type="submit">Search</button>
                        <button type="button" id="search-clear" class="secondary">Clear</button>
                    </div>
                </form>

                <p id="message" role="status"></p>
                <div id="packages-list"></div>
            </section>

            <section id="manage-section" hidden>
                <h2>Manage packages (staff)</h2>
                <p>You are signed in as staff. All packages, including drafts. Customers only see published packages.</p>
                <div id="manage-list"></div>
            </section>

            <section id="create-package-section" hidden>
                <h2 id="form-title">Create a tour package</h2>
                <form id="package-form">
                    <label for="title">Package Title</label>
                    <input type="text" id="title" maxlength="100" required>

                    <label for="destination">Destination</label>
                    <input type="text" id="destination" maxlength="60" required>

                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" required>

                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate" required>

                    <label for="price">Price (EGP)</label>
                    <input type="number" id="price" min="0" step="0.01" required>

                    <label for="totalSeats">Total Seats</label>
                    <input type="number" id="totalSeats" min="1" max="1000" step="1" required>

                    <label for="itinerary">Itinerary (one activity per line) </label>
                    <textarea id="itinerary" required></textarea>

                    <label class="checkbox-label">
                        <input type="checkbox" id="publishNow">
                        Published (customers can see and book it)
                    </label>

                    <button type="submit" id="form-submit">Create Package</button>
                    <button type="button" id="form-cancel" class="secondary" hidden>Cancel editing</button>
                </form>
            </section>
        </main>
        <script src="js/config.js" defer></script>
        <script src="js/auth-config.js" defer></script>
        <script src="js/auth.js" defer></script>
        <script src="js/app.js" defer></script>
    </body>
</html>
