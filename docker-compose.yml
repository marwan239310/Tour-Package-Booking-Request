services:
  package-service:
    build:
      context: ./package_service/src
      dockerfile: Dockerfile
    container_name: tour-package-backend
    ports:
      - "3001:3001"
    env_file:
      - path: ./package_service/src/.env
        required: false
    environment:
      - PORT=3001
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_ENDPOINT=http://host.docker.internal:4566
      # Staff login (team Cognito pool on Floci); set these in your shell or .env
      - COGNITO_ISSUER=${COGNITO_ISSUER:-}
      - COGNITO_JWKS_URL=${COGNITO_JWKS_URL:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - STAFF_GROUP=${STAFF_GROUP:-staff}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:4566}
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tour-package-frontend
    ports:
      - "8080:80"
    depends_on:
      - package-service
    restart: unless-stopped
