# Extra Floci settings, added on top of docker-compose.yml automatically by "docker compose".
# Lets the website (served at http://localhost:5500) call Cognito from the browser for login.
services:
  floci:
    environment:
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500"
      EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500"